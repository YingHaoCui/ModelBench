[project]
name = "modelbench"
version = "0.1.0"
description = "Streaming coding-session load generator for OpenAI-compatible clusters"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11,<4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
